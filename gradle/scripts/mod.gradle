// Shared settings applied by every backend after its Minecraft plugin.
apply plugin: 'java-library'
apply plugin: 'com.cleanroommc.tokenenvoy'

def dash = project.name.lastIndexOf('-')
ext.minecraftVersion = project.name.substring(0, dash)
ext.modLoader = project.name.substring(dash + 1)
ext.mcefProjectPath = minecraftVersion == '26.3' ? ":mcef-$modLoader" : ":mcef-$minecraftVersion-$modLoader"
apply from: rootProject.file('gradle/scripts/compatibility.gradle')
def targetProperties = new Properties()
rootProject.file("versions/$minecraftVersion/gradle.properties").withInputStream { targetProperties.load(it) }
ext.targetProperties = targetProperties
ext.targetJava = targetProperties.java_version.toInteger()
base.archivesName = mod_archive_name
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJava)
    if (generate_sources_jar.toBoolean()) withSourcesJar()
}
// 0.10-alpha.12 can append both shared and generated sources after active selection.
// Always compile the generated tree so every node follows the same preprocessing path.
def adaptedSources = tasks.register('adaptMinecraftSources', Sync) {
    dependsOn tasks.named('stonecutterGenerate')
    from layout.buildDirectory.dir('generated/stonecutter/main/java')
    into layout.buildDirectory.dir('generated/compatibility/java')
    inputs.property('minecraftVersion', minecraftVersion)
    inputs.file(rootProject.file('gradle/scripts/compatibility.gradle'))
    filter { String line -> adaptMinecraftSource(line, minecraftVersion) }
}
afterEvaluate {
    sourceSets.main.java.setSrcDirs([
        files(layout.buildDirectory.dir('generated/compatibility/java')).builtBy(adaptedSources)
    ])
    sourceSets.main.resources.setSrcDirs([
        files(layout.buildDirectory.dir('generated/stonecutter/main/resources')).builtBy(tasks.named('stonecutterGenerate'))
    ])
}
// All metadata lives in src/main/resources; ship only the selected loader's descriptor.
tasks.named('processResources') {
    inputs.property('equipment_baby_layer', stonecutter.eval(minecraftVersion, '>=26.3'))
    inputs.property('native_mixed_shapes', stonecutter.eval(minecraftVersion, '>=26.3'))
    ['block','item'].each { registry ->
        exclude "data/minecraft/tags/${registry}/wool_slabs.json"
        exclude "data/minecraft/tags/${registry}/wool_stairs.json"
    }
    if (stonecutter.eval(minecraftVersion, '>=26.3')) {
        filesMatching('assets/sum1rem0d/equipment/*.json') {
            def family = name.replace('.json', '')
            if (family == 'wooden') filter { String line -> line.contains('"humanoid": [') ? '    "humanoid_baby": [{"texture": "minecraft:leather", "dyeable": {"color_when_undyed": 9990207}}],\n' + line : line }
            if (family in ['emerald', 'redstone', 'lapis']) filter { String line -> line.contains('"humanoid": [') ? '    "humanoid_baby": [{"texture": "sum1rem0d:' + family + '"}],\n' + line : line }
        }
    } else {
        ['mixed_wool_slab','mixed_wool_stairs','mixed_concrete_slab','mixed_concrete_stairs'].each { name ->
            exclude "data/sum1rem0d/recipe/${name}.json"
            exclude "data/sum1rem0d/loot_table/blocks/${name}.json"
            exclude "assets/sum1rem0d/blockstates/${name}.json"
            exclude "assets/sum1rem0d/items/${name}.json"
            exclude "assets/sum1rem0d/models/block/${name}*.json"
        }
    }
    if (!stonecutter.eval(minecraftVersion, '>=26.3')) {
        doLast {
            def root = destinationDir
            def excludedIds = ['mixed_wool_slab', 'mixed_wool_stairs', 'mixed_concrete_slab', 'mixed_concrete_stairs'] as Set
            def schema = new File(root, 'assets/sum1rem0d/config-schema.json')
            if (schema.exists()) {
                def entries = new groovy.json.JsonSlurper().parse(schema)
                entries.removeAll { it instanceof Map && excludedIds.contains(it.id) }
                schema.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries)) + '\n'
            }
            def timing = new File(root, 'assets/sum1rem0d/config-timing.json')
            if (timing.exists()) {
                def data = new groovy.json.JsonSlurper().parse(timing)
                excludedIds.each { data.features.remove(it) }
                timing.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n'
            }
            new File(root, 'data/minecraft/tags').eachFileRecurse { tag ->
                if (!tag.isFile() || !tag.name.endsWith('.json')) return
                def data = new groovy.json.JsonSlurper().parse(tag)
                def stripShapeIds
                stripShapeIds = { value ->
                    if (value instanceof Map) value.values().each { child -> stripShapeIds(child) }
                    else if (value instanceof List) {
                        value.removeAll { entry -> entry instanceof String && (entry.startsWith('sum1rem0d:') && excludedIds.contains(entry.substring('sum1rem0d:'.length()))) }
                        value.each { child -> stripShapeIds(child) }
                    }
                }
                stripShapeIds(data)
                tag.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n'
            }
            def wiki = new File(root, 'assets/sum1rem0d/wiki/guide.json')
            if (wiki.exists()) {
                def data = new groovy.json.JsonSlurper().parse(wiki)
                data.categories.each { category -> category.features?.removeAll { excludedIds.contains(it) } }
                data.articles.removeAll { it instanceof Map && excludedIds.contains(it.feature) }
                wiki.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n'
            }
        }
    }
    inputs.property('mod_icon_metadata_key', modLoader == 'neoforge' && stonecutter.eval(minecraftVersion, '>=26.2') ? 'iconFile' : 'logoFile')
    from(rootProject.file('THIRD_PARTY_NOTICES.md'))
    if (modLoader != 'fabric') exclude 'fabric.mod.json'
    if (modLoader != 'forge') exclude 'META-INF/mods.toml'
    if (modLoader != 'neoforge') exclude 'META-INF/neoforge.mods.toml'
    if (modLoader == 'neoforge' && stonecutter.eval(minecraftVersion, '>=26.2')) {
        filesMatching('META-INF/neoforge.mods.toml') {
            filter { String line -> line.startsWith('logoFile=') ? line.replaceFirst('logoFile=', 'iconFile=') : line }
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

repositories { mavenCentral() }
ext.json5Coordinate = 'de.marhali:json5-java:3.0.0'
dependencies {
    implementation json5Coordinate
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.5"
    testImplementation 'com.google.code.gson:gson:2.14.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
// Optional real viewer jars are development inputs, never bundled in the distribution.
if (providers.gradleProperty('viewer_mod').isPresent()) {
    def viewer = providers.gradleProperty('viewer_mod').get()
    if (!(viewer in ['jei', 'rei', 'emi'])) throw new GradleException('viewer_mod must be jei, rei or emi')
    def viewerDirectory = minecraftVersion == '26.3' ? ".research/viewers/$modLoader-$viewer" : ".research/viewers/$minecraftVersion-$modLoader-$viewer"
    dependencies { runtimeOnly fileTree(rootProject.file(viewerDirectory)) { include '*.jar' } }
}
// Renderer compatibility jars are local verification inputs only.
if (providers.gradleProperty('renderer_mod').isPresent()) {
    def renderer = providers.gradleProperty('renderer_mod').get()
    if (renderer != 'sodium') throw new GradleException('renderer_mod must be sodium')
    dependencies { runtimeOnly fileTree(rootProject.file(".research/renderers/${project.name}-$renderer")) { include '*.jar' } }
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.withType(JavaExec).configureEach {
    if (name == 'runClient' && providers.gradleProperty('artwork_preview').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.artworkPreview=true'

    if (name == 'runServer' && providers.gradleProperty('bookshelf_verify').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.serverVerify=true', '-Dsum1rem0d.bookshelfVerify=true'
    if (name == 'runServer' && providers.gradleProperty('utility_features_verify').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.serverVerify=true', '-Dsum1rem0d.utilityFeaturesVerify=true'
    if (name == 'runServer' && providers.gradleProperty('combat_expansion_verify').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.serverVerify=true', '-Dsum1rem0d.combatExpansionVerify=true'
    if (name == 'runServer' && providers.gradleProperty('patch204_verify').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.serverVerify=true', '-Dsum1rem0d.patch204Verify=true'
    if (name == 'runServer' && providers.gradleProperty('patch203_verify').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.serverVerify=true', '-Dsum1rem0d.patch203Verify=true'
    if (name == 'runServer' && providers.gradleProperty('remaining_verify').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.remainingVerify=true'
    if (name == 'runClient' && providers.gradleProperty('remaining_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.remainingSmoke=true'

    if (name == 'runClient' && providers.gradleProperty('asset_redesign_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.assetRedesignSmoke=true'
    if (name == 'runClient' && providers.gradleProperty('combat_concrete_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.combatConcreteSmoke=true'
    if (name == 'runClient' && providers.gradleProperty('nether_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.netherSmoke=true'
    if (name == 'runClient' && providers.gradleProperty('trade_toast_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.tradeToastSmoke=true'
    if (name == 'runClient' && providers.gradleProperty('hud_keys_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.hudKeysSmoke=true'
    if (name == 'runClient' && providers.gradleProperty('suggestions_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.suggestionsSmoke=true'
    if (name == 'runServer' && providers.gradleProperty('chat_verify').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.chatVerify=true'
    if (name == 'runClient' && providers.gradleProperty('chat_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.chatSmoke=true'
    if (name == 'runServer' && providers.gradleProperty('coin_services_verify').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.coinServicesVerify=true'
    if (name == 'runClient' && providers.gradleProperty('coin_services_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.coinServicesSmoke=true'
    if (name == 'runServer' && providers.gradleProperty('economy_verify').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.economyVerify=true'
    if (name == 'runClient' && providers.gradleProperty('economy_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.economySmoke=true'
    if (name == 'runClient' && providers.gradleProperty('wiki_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.wikiSmoke=true'
    if (name == 'runClient' && providers.gradleProperty('bookshelf_assets_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.utilityAssetsSmoke=true', '-Dsum1rem0d.bookshelfAssetsSmoke=true'
    if (name == 'runClient' && providers.gradleProperty('utility_assets_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.utilityAssetsSmoke=true'
    if (name == 'runClient' && providers.gradleProperty('ime_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.imeSmoke=true'
    if (name == 'runClient' && providers.gradleProperty('mobility_client_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.mobilityClientSmoke=true'
    if (name == 'runClient' && providers.gradleProperty('last_tool_back_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.lastToolBackSmoke=true'
    if (name == 'runServer' && providers.gradleProperty('multi_verify').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.multiVerify=true'
    if (name == 'runClient' && providers.gradleProperty('multi_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.multiSmoke=true'
    if (name == 'runClient' && providers.gradleProperty('viewer_smoke').map { it.toBoolean() }.orElse(false).get()) jvmArgs '-Dsum1rem0d.viewerSmoke=true', "-Dsum1rem0d.viewer=${providers.gradleProperty('viewer_mod').getOrElse('jei')}"
    if (name == 'runServer') standardInput = System.in
    if (name == 'runClient' && ['bookshelf_assets_smoke', 'utility_assets_smoke', 'remaining_smoke', 'client_smoke', 'network_smoke', 'browser_smoke', 'toast_smoke', 'viewer_smoke', 'multi_smoke', 'wiki_smoke', 'ime_smoke', 'mobility_client_smoke', 'last_tool_back_smoke', 'economy_smoke', 'coin_services_smoke', 'chat_smoke', 'suggestions_smoke', 'trade_toast_smoke'].any { providers.gradleProperty(it).map { value -> value.toBoolean() }.orElse(false).get() }) {
        environment 'SDL_WINDOW_ACTIVATE_WHEN_SHOWN', '0'
        environment 'SDL_WINDOW_ACTIVATE_WHEN_RAISED', '0'
    }
    def reportModes = name == 'runServer' ? [bookshelf_verify: 'run/world/sum1rem0d-verification.json', utility_features_verify: 'run/world/sum1rem0d-verification.json', combat_expansion_verify: 'run/world/sum1rem0d-verification.json', patch204_verify: 'run/world/sum1rem0d-verification.json', patch203_verify: 'run/world/sum1rem0d-verification.json', remaining_verify: 'run/world/sum1rem0d-remaining-live.json', chat_verify: 'run/world/sum1rem0d-chat-network.json', coin_services_verify: 'run/world/sum1rem0d-coin-services-multiplayer.json', economy_verify: 'run/world/sum1rem0d-economy-multiplayer.json', server_verify: 'run/world/sum1rem0d-verification.json', toast_verify: 'run/world/sum1rem0d-toast-verification.json', multi_verify: 'run/world/sum1rem0d-multiplayer-verification.json']
        : name == 'runClient' ? [bookshelf_assets_smoke: 'run/sum1rem0d-bookshelf-assets.json', utility_assets_smoke: 'run/sum1rem0d-utility-assets.json', remaining_smoke: 'run/sum1rem0d-remaining-client.json', combat_concrete_smoke: 'run/sum1rem0d-combat-concrete-client.json', nether_smoke: 'run/sum1rem0d-nether-visual.json', trade_toast_smoke: 'run/sum1rem0d-trade-toast-verification.json', suggestions_smoke: 'run/sum1rem0d-suggestions-verification.json', chat_smoke: 'run/sum1rem0d-chat-client.json', coin_services_smoke: 'run/sum1rem0d-coin-services-verification.json', economy_smoke: 'run/sum1rem0d-economy-verification.json', client_smoke: 'run/sum1rem0d-client-verification.json', network_smoke: 'run/sum1rem0d-network-verification.json', browser_smoke: 'run/sum1rem0d-browser-verification.json', toast_smoke: 'run/sum1rem0d-toast-verification.json', viewer_smoke: 'run/sum1rem0d-viewer-verification.json', multi_smoke: 'run/sum1rem0d-multiplayer-verification.json', wiki_smoke: 'run/sum1rem0d-wiki-verification.json', ime_smoke: 'run/sum1rem0d-ime-verification.json', mobility_client_smoke: 'run/sum1rem0d-mobility-client-verification.json', last_tool_back_smoke: 'run/sum1rem0d-last-tool-back-verification.json'] : [:]
    if (name == 'runClient' && providers.gradleProperty('viewer_mod').getOrElse('jei') == 'emi') reportModes.viewer_smoke = 'run/sum1rem0d-emi-verification.json'
    def activeModes = reportModes.findAll { key, value -> providers.gradleProperty(key).map { it.toBoolean() }.orElse(false).get() }
    if (name == 'runClient' && providers.gradleProperty('client_run_dir').isPresent()) activeModes = activeModes.collectEntries { key, value -> [(key): providers.gradleProperty('client_run_dir').get() + value.substring(3)] }
    if (activeModes.size() > 1) throw new GradleException('Run one native verification mode at a time.')
    String reportPath = activeModes.values().find()
    if (reportPath != null) {
        doFirst { java.nio.file.Files.deleteIfExists(file(reportPath).toPath()) }
        doLast {
            def report = file(reportPath)
            if (!report.exists()) throw new GradleException("Verification report missing: $report")
            def result = new groovy.json.JsonSlurper().parse(report)
            if (result.success != true) throw new GradleException("Native verification failed: ${result.failure}")
            logger.lifecycle("Verified ${result.passed != null ? result.passed.size() : result.screenshots.size()} native checks: $report")
        }
    }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar', Jar) {
    archiveClassifier = "$minecraftVersion-$modLoader-dev"
    from(rootProject.file('LICENSE.md'))
    from(rootProject.file('licenses')) { into 'licenses' }
    manifest.attributes('Implementation-Title': mod_name, 'Implementation-Version': project.version.toString())
}

def json = { value ->
    def encoded = groovy.json.JsonOutput.toJson(value.toString())
    encoded.substring(1, encoded.length() - 1)
}
def authors = mod_authors.split(',').collect { it.trim() }.findAll { it }.collect { groovy.json.JsonOutput.toJson(it) }.join(', ')
tokenEnvoy {
    set 'MOD_ID', mod_id
    set 'MOD_NAME', mod_name
    set 'MOD_NAME_JSON', json(mod_name)
    set 'MOD_VERSION', project.version.toString()
    set 'MOD_DESCRIPTION', json(mod_description)
    set 'MOD_AUTHORS', authors
    set 'MOD_AUTHORS_JSON_STRINGS', authors ? authors.substring(1, authors.length() - 1) : ''
    set 'MOD_AUTHORS_TEXT', json(mod_authors)
    set 'MOD_LICENSE', json(mod_license)
    set 'MOD_URL', json(mod_url)
    set 'MOD_SOURCES_URL', json(mod_sources_url)
    set 'MOD_ISSUE_TRACKER', json(mod_issue_tracker)
    set 'MOD_PACKAGE', mod_package
    set 'MINECRAFT_VERSION', minecraftVersion
    set 'JAVA_VERSION', targetJava.toString()
    set 'FABRIC_LOADER_VERSION', targetProperties.getProperty('fabric_loader_version', '')
    set 'LOADER_MAJOR', targetProperties.getProperty("${modLoader}_version", '0').tokenize('.')[0]
}
