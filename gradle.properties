org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
# Minecraft build plugins and Forgix still require cross-project configuration.
org.gradle.configuration-cache=false
dev.kikugie.stonecutter.hard_mode=true

# Mod identity. Changing mod_package also requires moving the Java source packages.
mod_name=Sum1reM0d
mod_id=sum1rem0d
mod_package=com.sumirelabs.sum1rem0d
mod_group=com.sumirelabs
mod_archive_name=sum1rem0d
mod_description=Everyday Minecraft, with unreasonable rules.
mod_authors=Sumire Labs
mod_license=BlueOak-1.0.0
mod_url=https://github.com/Sumire-Labs/Sum1reM0d
mod_sources_url=https://github.com/Sumire-Labs/Sum1reM0d
mod_issue_tracker=https://github.com/Sumire-Labs/Sum1reM0d/issues

# One Git-derived version for every target. Do not add version/mod_version.
versioning.releaseBranch=main
versioning.developmentPrefix=develop

# Gradleで読み込む・ビルドするMinecraft版。allなら対応一覧の全版。
target_versions=all
# 上の版で読み込むローダー。allならその版で対応する全ローダー。
target_loaders=all
# targets=1.16.5-forge,26.3-fabric のように指定すると、上の2つより優先。
# IDEで編集する基準ターゲット。これだけでビルド対象は絞り込まない。
stonecutter_active=26.3-fabric

# Pinned published versions, checked 2026-10-09. No dynamic '+' dependencies.
stonecutter_version=0.10-alpha.12
tokenenvoy_version=3.0.0
versioning_version=3.3.0
forgix_version=2.0.0
loom_version=1.18.3
tau_moddev_version=2.0.147-tau.1
foojay_version=1.0.0

generate_sources_jar=true
# auto: generate Minecraft sources locally, use binary patching in CI.
# true/false explicitly skip/enable Minecraft decompilation and recompilation.
moddev_disable_recompilation=auto
moddev_validate_access_transformers=true
minecraft_username=Developer
# Required by current Loom for old Minecraft releases.
fabric.loom.enableMinecraftVerification=false
# Forgixを有効化。統合するときはmergeJarsを明示実行。
enable_forgix=false
# 読み込んだ対象のうち、このMinecraft版のJarだけを統合する。
forgix_minecraft_version=26.3
# 統合するローダー候補。そのMinecraft版に存在するものだけを選ぶ。
# 1.20.1ならFabric+Forge、1.21.1/26.xならFabric+NeoForge。
forgix_loaders=fabric,forge,neoforge

# Manual CurseForge / Modrinth publication. GitHub Releases use pushed tags.
# Project IDs may also be overridden in versions/<Minecraft>/gradle.properties.
publish_modrinth=false
modrinth_project_id=
publish_curseforge=false
curseforge_project_id=
release_type=release
