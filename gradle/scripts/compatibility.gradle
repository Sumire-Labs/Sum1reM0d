// Package and input-symbol moves between 26.2 and 26.3. Semantic changes
// remain explicit version branches in Java; this only adapts renamed symbols.
ext.adaptMinecraftSource = { String line, String mc ->
    if (mc == '26.3') return line
    if (line.trim() == 'import net.minecraft.util.Prediction;') return ''
    line = line.replaceAll(',\\s*(?:net\\.minecraft\\.util\\.)?Prediction\\.SERVER_ONLY', '')
    line = line.replace('InputConstants.Type.KEYBOARD', 'InputConstants.Type.KEYSYM')
    line = line.replace('AbstractBedBlock', 'BedBlock').replace('RedstoneWireBlock', 'RedStoneWireBlock')
        .replace('net/minecraft/client/renderer/texture/UvMapping', 'net/minecraft/client/renderer/texture/TextureAtlasSprite')
        .replace(', net.minecraft.util.Prediction.SERVER_ONLY', '')
        .replace('.display().title()', '.display().getTitle()').replace('.display().icon()', '.display().getIcon()')
        .replace('.damageCooldownTime', '.invulnerableTime')
        .replace('.setInvulnerableTime(0)', '.invulnerableTime = 0')
        .replace('startSleepInBed(block, head, block.getBedRule(level, bed.east()), bed.east())', 'startSleepInBed(bed.east())')
        .replace('onTextInputFocusChange(this, value)', 'onTextInputFocusChange(value)')
        .replace('org.lwjgl.sdl.SDLMouse.', 'org.lwjgl.glfw.GLFW.')
        .replace('SDL_BUTTON_', 'GLFW_MOUSE_BUTTON_')
        .replace('SDLMouse.GLFW_MOUSE_BUTTON_', 'GLFW.GLFW_MOUSE_BUTTON_')
        .replace('mc.mouseHandler.onMove(', '((com.sumirelabs.sum1rem0d.mixin.MouseInputAccessor) mc.mouseHandler).sum1rem0d$onMove(')
        .replace('mc.mouseHandler.onButton(', '((com.sumirelabs.sum1rem0d.mixin.MouseInputAccessor) mc.mouseHandler).sum1rem0d$onButton(')
        .replace('mc.keyboardHandler.charTyped(', '((com.sumirelabs.sum1rem0d.mixin.KeyboardInputAccessor) mc.keyboardHandler).sum1rem0d$charTyped(')
    if (line.contains('sum1rem0d$onMove(')) line = line.replace(', windowY, 0, 0)', ', windowY)').replace(', y, 0, 0)', ', y)')
    line = line.replace('com.mojang.renderpearl.api.textures.', 'com.mojang.blaze3d.textures.')
        .replace('com.mojang.renderpearl.api.buffers.', 'com.mojang.blaze3d.buffers.')
        .replace('com.mojang.renderpearl.api.GpuFormat', 'com.mojang.blaze3d.GpuFormat')
        .replace('com.mojang.renderpearl.api.CommandEncoder', 'com.mojang.blaze3d.systems.CommandEncoder')
        .replace('com.mojang.renderpearl.api.RenderPass', 'com.mojang.blaze3d.systems.RenderPass')
        .replace('com.mojang.renderpearl.api.pipeline.', 'com.mojang.blaze3d.pipeline.')
    if (line.startsWith('import org.lwjgl.sdl.')) return 'import org.lwjgl.glfw.GLFW;'
    line = line.replace('SDLScancode.SDL_SCANCODE_', 'GLFW.GLFW_KEY_')
        .replace('SDLKeycode.SDL_KMOD_', 'GLFW.GLFW_MOD_')
        .replace('SDLMouse.SDL_BUTTON_', 'GLFW.GLFW_MOUSE_BUTTON_')
        .replace('GLFW_MOD_GUI', 'GLFW_MOD_SUPER')
        .replace('GLFW_MOD_CTRL', 'GLFW_MOD_CONTROL')
        .replace('GLFW_KEY_RETURN', 'GLFW_KEY_ENTER')
        .replace('GLFW_KEY_LCTRL', 'GLFW_KEY_LEFT_CONTROL').replace('GLFW_KEY_RCTRL', 'GLFW_KEY_RIGHT_CONTROL')
        .replace('GLFW_KEY_LSHIFT', 'GLFW_KEY_LEFT_SHIFT').replace('GLFW_KEY_RSHIFT', 'GLFW_KEY_RIGHT_SHIFT')
        .replace('GLFW_KEY_LALT', 'GLFW_KEY_LEFT_ALT').replace('GLFW_KEY_RALT', 'GLFW_KEY_RIGHT_ALT')
        .replace('GLFW_KEY_LGUI', 'GLFW_KEY_LEFT_SUPER').replace('GLFW_KEY_RGUI', 'GLFW_KEY_RIGHT_SUPER')
        .replace('GLFW_KEY_CAPSLOCK', 'GLFW_KEY_CAPS_LOCK').replace('GLFW_KEY_PRINTSCREEN', 'GLFW_KEY_PRINT_SCREEN')
        .replace('GLFW_KEY_SCROLLLOCK', 'GLFW_KEY_SCROLL_LOCK').replace('GLFW_KEY_NUMLOCKCLEAR', 'GLFW_KEY_NUM_LOCK')
        .replace('GLFW_KEY_PAGEUP', 'GLFW_KEY_PAGE_UP').replace('GLFW_KEY_PAGEDOWN', 'GLFW_KEY_PAGE_DOWN')
        .replace('GLFW_KEY_KP_PERIOD', 'GLFW_KEY_KP_DECIMAL').replace('GLFW_KEY_KP_MINUS', 'GLFW_KEY_KP_SUBTRACT')
        .replace('GLFW_KEY_KP_PLUS', 'GLFW_KEY_KP_ADD').replace('GLFW_KEY_KP_EQUALS', 'GLFW_KEY_KP_EQUAL')
        .replace('GLFW_KEY_EQUALS', 'GLFW_KEY_EQUAL').replace('GLFW_KEY_LEFTBRACKET', 'GLFW_KEY_LEFT_BRACKET')
        .replace('GLFW_KEY_RIGHTBRACKET', 'GLFW_KEY_RIGHT_BRACKET').replace('GLFW_KEY_GRAVE', 'GLFW_KEY_GRAVE_ACCENT')
        .replace('SDLMouse.SDL_SYSTEM_CURSOR_NWSE_RESIZE', 'org.lwjgl.glfw.GLFW.GLFW_RESIZE_NWSE_CURSOR')
        .replace('SDLMouse.SDL_SYSTEM_CURSOR_NESW_RESIZE', 'org.lwjgl.glfw.GLFW.GLFW_RESIZE_NESW_CURSOR')
    if (mc.startsWith('26.1')) line = line.replace('com.mojang.blaze3d.GpuFormat', 'com.mojang.blaze3d.textures.TextureFormat').replace('GpuFormat.RGBA8_UNORM', 'TextureFormat.RGBA8')
        .replace('writeToTexture(gpuTexture, buffer, 0, 0, 0, 0, width, height)', 'writeToTexture(gpuTexture, buffer, com.mojang.blaze3d.platform.NativeImage.Format.RGBA, 0, 0, 0, 0, width, height)')
        .replace('.gui.screen()', '.screen').replace('.gui.setScreen(', '.setScreen(')
        .replace('.gui.overlay()', '.getOverlay()').replace('.gui.toastManager()', '.getToastManager()')
        .replace('.gameRenderer.mainRenderTarget()', '.getMainRenderTarget()')
        .replace('net.minecraft.advancements.triggers.', 'net.minecraft.advancements.criterion.')
        .replace('net/minecraft/advancements/triggers/', 'net/minecraft/advancements/criterion/')
        .replace('.gui.hud.isHidden()', '.options.hideGui').replace('.gui.hud.toggle()', '.options.hideGui = !mc.options.hideGui')
        .replace('.gameRenderer.mainCamera()', '.gameRenderer.getMainCamera()')
        .replace('mc.levelRenderer.invalidateCompiledGeometry(mc.level, mc.options, mc.gameRenderer.getMainCamera(), mc.getBlockColors())', 'mc.levelRenderer.allChanged()')
        .replace('LightCoordsUtil.getLightCoords(', 'net.minecraft.client.renderer.LevelRenderer.getLightCoords(')
        .replace('EntityTypes.', 'EntityType.')
        .replace('Blocks.BED.pick(net.minecraft.world.item.DyeColor.RED)', 'Blocks.RED_BED')
        .replace('Blocks.BED.pick(DyeColor.RED)', 'Blocks.RED_BED')
        .replace('Blocks.WOOL.pick(DyeColor.WHITE)', 'Blocks.WHITE_WOOL')
    line = line.replace('chat.unsignedContent().orElseGet(() -> Component.literal(chat.body().content()))', 'chat.unsignedContent() != null ? chat.unsignedContent() : Component.literal(chat.body().content())')
    return line
}
